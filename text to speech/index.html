<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text ↔ Speech Converter</title>

<style>
:root {
    --primary: #e5322d;
    --bg: #f6f6f6;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
}

header {
    background: white;
    padding: 20px 40px;
    border-bottom: 1px solid #ddd;
    font-size: 22px;
    font-weight: bold;
    color: var(--primary);
}

.container {
    max-width: 900px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

.tab {
    flex: 1;
    padding: 15px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    background: #f1f1f1;
    font-weight: bold;
}

.tab.active {
    background: var(--primary);
    color: white;
}

.card {
    display: none;
}

.card.active {
    display: block;
}

textarea {
    width: 100%;
    height: 150px;
    padding: 15px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    resize: none;
}

.controls {
    margin-top: 20px;
    display: flex;
    gap: 15px;
    align-items: center;
}

select, button {
    padding: 12px 20px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: var(--primary);
    color: white;
    border: none;
    cursor: pointer;
}

button.secondary {
    background: #444;
}

.output {
    margin-top: 20px;
    padding: 15px;
    border: 1px dashed #ccc;
    border-radius: 8px;
    min-height: 80px;
}
</style>
</head>

<body>

<header>Text & Speech Tools</header>

<div class="container">

    <div class="tabs">
        <div class="tab active" onclick="showTab('tts')">Text to Speech</div>
        <div class="tab" onclick="showTab('stt')">Speech to Text</div>
    </div>

    <!-- TEXT TO SPEECH -->
    <div class="card active" id="tts">
        <textarea id="ttsText" placeholder="Enter text to convert into speech..."></textarea>

        <div class="controls">
            <select id="ttsLang">
                <option value="en-US">English</option>
                <option value="hi-IN">Hindi</option>
            </select>
            <button onclick="speakText()">Speak</button>
            <button class="secondary" onclick="speechSynthesis.cancel()">Stop</button>
        </div>
    </div>

    <!-- SPEECH TO TEXT -->
    <div class="card" id="stt">
        <div class="controls">
            <select id="sttLang">
                <option value="en-US">English</option>
                <option value="hi-IN">Hindi</option>
            </select>
            <button onclick="startSpeech()">Start Speaking</button>
            <button class="secondary" onclick="stopSpeech()">Stop</button>
        </div>

        <div class="output" id="sttOutput">
            Your spoken text will appear here...
        </div>
    </div>

</div>

<script>
/* Tab logic */
function showTab(tabId) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));

    document.querySelector(`[onclick="showTab('${tabId}')"]`).classList.add("active");
    document.getElementById(tabId).classList.add("active");
}

/* TEXT TO SPEECH */
function speakText() {
    const text = document.getElementById("ttsText").value;
    const lang = document.getElementById("ttsLang").value;

    if (!text) return alert("Please enter text");

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;

    speechSynthesis.speak(utterance);
}

/* SPEECH TO TEXT */
const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;

function startSpeech() {
    recognition = new SpeechRecognition();
    recognition.lang = document.getElementById("sttLang").value;
    recognition.continuous = false;

    recognition.onresult = (event) => {
        document.getElementById("sttOutput").innerText =
            event.results[0][0].transcript;
    };

    recognition.onerror = () => {
        alert("Speech recognition error");
    };

    recognition.start();
}

function stopSpeech() {
    if (recognition) recognition.stop();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image to PDF Converter</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f6f6;
}

header {
    background: #e5322d;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 22px;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
}

#dropZone {
    border: 2px dashed #ccc;
    padding: 40px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    color: #666;
}

#dropZone.dragover {
    border-color: #e5322d;
    background: #fff5f5;
}

#preview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.preview-item {
    position: relative;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    background: #fafafa;
}

.preview-item img {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

.remove-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: #e5322d;
    color: white;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    cursor: pointer;
    font-size: 14px;
}

.actions {
    text-align: center;
    margin-top: 30px;
}

button {
    padding: 12px 30px;
    background: #e5322d;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

button:disabled {
    background: #ccc;
    cursor: not-allowed;
}
</style>
</head>

<body>

<header>Image to PDF Converter</header>

<div class="container">

    <input type="file" id="fileInput" multiple accept="image/*" hidden>

    <div id="dropZone">
        <strong>Click or Drag Images Here</strong>
        <p>Convert images into a single PDF</p>
    </div>

    <div id="preview"></div>

    <div class="actions">
        <button id="convertBtn" disabled>Convert to PDF</button>
    </div>

</div>

<script>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const convertBtn = document.getElementById("convertBtn");

let images = [];

/* Click upload */
dropZone.onclick = () => fileInput.click();

/* File input */
fileInput.onchange = (e) => handleFiles(e.target.files);

/* Drag & drop */
dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    handleFiles(e.dataTransfer.files);
});

/* Handle files */
function handleFiles(files) {
    for (let file of files) {
        if (!file.type.startsWith("image")) continue;

        images.push({
            file,
            id: crypto.randomUUID()
        });
    }
    renderPreview();
}

/* Render preview */
function renderPreview() {
    preview.innerHTML = "";

    images.forEach((imgObj, index) => {
        const div = document.createElement("div");
        div.className = "preview-item";
        div.dataset.id = imgObj.id;

        const img = document.createElement("img");
        img.src = URL.createObjectURL(imgObj.file);

        const remove = document.createElement("button");
        remove.className = "remove-btn";
        remove.innerText = "×";
        remove.onclick = () => {
            images.splice(index, 1);
            renderPreview();
        };

        div.appendChild(img);
        div.appendChild(remove);
        preview.appendChild(div);
    });

    convertBtn.disabled = images.length === 0;
}

/* Sortable (reorder) */
new Sortable(preview, {
    animation: 150,
    onEnd: () => {
        const newOrder = [];
        document.querySelectorAll(".preview-item").forEach(item => {
            const found = images.find(i => i.id === item.dataset.id);
            newOrder.push(found);
        });
        images = newOrder;
    }
});

/* Convert to PDF */
convertBtn.onclick = async () => {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();

    for (let i = 0; i < images.length; i++) {
        const imgData = await toBase64(images[i].file);
        pdf.addImage(imgData, "JPEG", 10, 10, 190, 0);
        if (i < images.length - 1) pdf.addPage();
    }

    pdf.save("images.pdf");
};

/* File to Base64 */
function toBase64(file) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
    });
}
</script>

</body>
</html>
